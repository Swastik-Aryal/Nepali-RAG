[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nepali-rag"
version = "0.1.0"
description = "All-in-one RAG framework for Nepali Documents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Swastik Aryal"},
]
keywords = [
    "nepali",
    "rag",
    "retrieval-augmented-generation",
    "nlp",
    "devanagari",
    "ocr",
    "langchain",
    "qdrant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    # Document parsing
    "PyMuPDF>=1.27.1",
    "pytesseract>=0.3.13",
    "Pillow>=11.1.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "striprtf>=0.0.32",
    "beautifulsoup4>=4.13.3",
    "EbookLib>=0.20",
    "odfpy>=1.4.1",

    # Configuration
    "pydantic>=2.12.5",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.2.2",

    # LangChain
    "langchain-core>=1.4.9",
    "langchain-text-splitters>=1.1.2",
    "langchain-openai>=1.3.5",
    "langchain-google-genai>=4.2.7",
    "langchain-ollama>=0.3.10",
    "langchain-anthropic>=1.4.8",
    "langchain-huggingface>=1.2.2",

    # Embeddings and reranking
    "sentence-transformers>=5.5.1",
    "transformers>=4.57.6",
    "numpy>=2.4.6",
    "torch>=2.12.1",

    # Vector store
    "qdrant-client>=1.18.0",
    "bm25s>=0.3.9",

    # API
    "fastapi>=0.127.0,<0.129.1",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",

    # LLM providers
    "openai>=2.45.0",

    # MCP server
    "mcp[cli]>=1.25.0",
]

[project.optional-dependencies]
evals = [
    "deepeval>=4.1.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.11.10",
]

[project.urls]
Homepage = "https://github.com/Swastik-Aryal/Nepali-RAG"
Repository = "https://github.com/Swastik-Aryal/Nepali-RAG"
Issues = "https://github.com/Swastik-Aryal/Nepali-RAG/issues"
Documentation = "https://github.com/Swastik-Aryal/Nepali-RAG"

[project.scripts]
nepali-rag = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["nepali_rag*"]
exclude = ["nepali_rag.data*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

